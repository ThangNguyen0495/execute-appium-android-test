name: 'Android Appium Workflow Action'
description: 'Custom GitHub Action to run Appium tests with Maven.'
inputs:
  java_version:
    description: 'The version of Java to install.'
    required: false
    default: '22'

  api_level:
    description: 'The SDK level'
    required: false
    default: '35'

  node_version:
    description: 'The version of NodeJS to install.'
    required: false
    default: '21'

  test_name:
    description: 'The name of the test suite.'
    required: true

  scripts:
    description: 'The maven commands to execute the test.'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: ${{ inputs.java_version }}

    - name: Install FFmpeg
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update > /dev/null 2>&1
        sudo apt-get install -y ffmpeg > /dev/null 2>&1
      shell: bash

    - name: Install FFmpeg
      if: runner.os == 'macOS'
      run: brew install ffmpeg > /dev/null 2>&1
      shell: bash

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node_version }}

    - name: Create and start emulator
      uses: ThangNguyen0495/create-android-emulator@main
      with:
        api-level: ${{ inputs.api_level }}

    - name: Install Appium
      run: npm install -g appium > /dev/null 2>&1
      shell: bash

    - name: Install UIAutomator2 driver
      run: appium driver install uiautomator2 > /dev/null 2>&1
      shell: bash

    - name: Start Appium server
      run: |
        nohup appium -a 0.0.0.0 -p 4723 -pa /wd/hub > appium_log.txt 2>&1 & > /dev/null 2>&1
      shell: bash

    - name: Install dependencies
      run: |
        mvn install -DskipTests > /dev/null 2>&1
      shell: bash

    - name: Run Appium tests with Maven
      run: |
        - name: Run Appium tests with Maven (Retry if ADB Offline)
  run: |
    for i in {1..3}; do
      eval "${{ inputs.scripts }}" && break || {
        echo "⚠️ Tests failed (attempt $i), restarting ADB..."
        $ANDROID_HOME/platform-tools/adb kill-server
        $ANDROID_HOME/platform-tools/adb start-server
        sleep 10
        $ANDROID_HOME/platform-tools/adb devices
      }
    done
  shell: bash
      shell: bash

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Test Reports - ${{ inputs.test_name }}
        path: |
          **/target/BufferLog.log
          **/target/ExtentReport.html
